<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover,user-scalable=no,maximum-scale=1">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Chimpy">
<meta name="theme-color" content="#7FBEEB">
<link rel="manifest" href="manifest.json">
<link rel="apple-touch-icon" href="icons/icon-180.png">
<title>Chimpy</title>
<style>
  * { margin:0; padding:0; box-sizing:border-box; -webkit-tap-highlight-color:transparent; }
  html, body {
    position:fixed; inset:0; width:100%; height:100%; overflow:hidden;
    background:#7FBEEB; overscroll-behavior:none;
    -webkit-user-select:none; user-select:none;
    font-family:-apple-system,'Helvetica Neue',Inter,system-ui,sans-serif;
  }
  #stage { position:absolute; inset:0; touch-action:none; }
  #c { position:absolute; inset:0; display:block; width:100%; height:100%; }
  #safe { position:absolute; top:0; left:0; width:0;
          height:env(safe-area-inset-top); pointer-events:none; }
</style>
</head>
<body>
<div id="stage"><canvas id="c"></canvas><div id="safe"></div></div>
<script>
(function () {
"use strict";
var S = { current: null };

/* ------------------------------------------------------------------
   THREAD

   swing on a branch, let go at the right moment, fly through the gap.
   miss the gap and you are done. that is the whole game.

   every swing is identical — fixed rope, standardised catch speed — so
   the timing is learnable. only the gap moves.

   the level is generated by simulating an ideal release: a gap is placed
   exactly where some valid release would send you, and the next branch
   is placed on that same flight path. so every gap is threadable and
   every landing is catchable, by construction.
------------------------------------------------------------------ */

const G = 606;             // pace: another 15% faster
const ROPE = 209;
const CATCH_SPEED = 412;   // nominal speed at the bottom of the swing
const KICK = 1.28;
const ENTRY = 50 * Math.PI / 180;     // how far behind the branch you catch it
const AHEAD = ROPE * Math.sin(ENTRY);
const HANG  = ROPE * Math.cos(ENTRY);
const CATCH_R = 262;
const REEL = 259;
const WALL_W = 22;
const PR = 7;              // player radius
const DEATH_Y = 900;
const WORLD_TOP = -700;    // scenery is drawn in world space, not camera space
const WORLD_BOT = 1300;
const LEAF_STEP = 40;

/* measured: gap 300px -> 872ms release window, 220 -> 796, 150 -> 662,
   120 -> 488, 85 -> 289. the ramp walks down that curve over 100 gaps */
const RAMP = 38;
const lerp = (a, b, t) => a + (b - a) * t;
const cfgFor = (passed) => {
  const d = Math.min(1, passed / RAMP);
  return {
    d,
    gap: lerp(238, 58, d),
    dbl: d < 0.30 ? 0 : Math.min(0.55, (d - 0.30) * 1.1),
    snap: lerp(3.48, 2.23, d),
  };
};

const COL = {
  sky0: "#7FBEEB",   // clear blue up top
  sky1: "#AFDAF2",
  sky2: "#E7DCEA",   // pale lilac   // warm peach at the horizon
  cloud: "#FBFDFF",          // distant ranges
  mintCanopy: "#93C88C", mintCanopy2: "#76B27C",
  mintTrunk: "#8C7F73", ground1: "#9CCB74", ground2: "#79B268",

  trunk: "#E8CFA4",  // the ones you play against — warmest, highest contrast
  trunkDark: "#C9A97C",
  trunkLine: "#8E7350",
  leaf: "#74C27A",
  leafHi: "#A2D98C",
  leafLine: "#43815A",
  fruit: "#E0685C",
  bark: "#C09468",

  fur: "#F0902F",    // the monkey pops against all of it
  furDark: "#E07A2E",
  belly: "#FFE3B8",
  ink: "#2A2028",
  accent: "#F0B455",
  bad: "#E0685C",
  rope: "#7FA86B",
  dim: "rgba(63,58,70,0.45)",
};

/* deterministic scatter — the same tree is in the same place forever */
const hash = (n) => {
  const x = Math.sin(n * 127.1) * 43758.5453;
  return x - Math.floor(x);
};

    const canvas = document.getElementById('c');
    const wrap = document.getElementById('stage');
    if (!canvas || !wrap) return;
    const ctx = canvas.getContext("2d");

    let AC = null;
    const blip = (f, dur, type, gain, to) => {
      if (!AC || S.current.muted) return;
      try {
        const o = AC.createOscillator(), g = AC.createGain();
        o.type = type || "sine";
        o.frequency.setValueAtTime(f, AC.currentTime);
        if (to) o.frequency.exponentialRampToValueAtTime(to, AC.currentTime + dur);
        g.gain.setValueAtTime(0.0001, AC.currentTime);
        g.gain.exponentialRampToValueAtTime(gain || 0.1, AC.currentTime + 0.01);
        g.gain.exponentialRampToValueAtTime(0.0001, AC.currentTime + dur);
        o.connect(g).connect(AC.destination);
        o.start(); o.stop(AC.currentTime + dur + 0.02);
      } catch (e) {}
    };
    const initAudio = () => {
      if (AC) return;
      try { AC = new (window.AudioContext || window.webkitAudioContext)(); }
      catch (e) {}
    };

    const rnd = () => Math.random();

    /* ---------- level generation: build it from an ideal release ---------- */
    const flightPath = (by, phi, limit) => {
      const v2 = CATCH_SPEED * CATCH_SPEED
               - 2 * G * (ROPE - Math.cos(phi) * ROPE);
      if (v2 <= 0) return null;
      const v = Math.sqrt(v2) * KICK;
      let x = Math.sin(phi) * ROPE;
      let y = by + Math.cos(phi) * ROPE;
      let vx = v * Math.cos(phi), vy = -v * Math.sin(phi);
      if (vx <= 60) return null;
      const pts = [{ x, y, vy }];
      for (let i = 0; i < 420; i++) {
        vy += G * 0.012; x += vx * 0.012; y += vy * 0.012;
        pts.push({ x, y, vy });
        if (x > limit || y > 1400) break;
      }
      return pts;
    };

    const yAt = (pts, X) => {
      for (let i = 1; i < pts.length; i++) {
        if (pts[i - 1].x <= X && X <= pts[i].x) {
          const f = (X - pts[i - 1].x) / Math.max(1e-6, pts[i].x - pts[i - 1].x);
          return pts[i - 1].y + (pts[i].y - pts[i - 1].y) * f;
        }
      }
      return null;
    };

    const genFrom = (bx, by, passed) => {
      const c = cfgFor(passed);
      const spread = c.d;
      /* aim for a height rather than taking whatever comes out first.
         without this every branch lands at roughly the same level and the
         whole run sits in one horizontal band */
      const target = 170 + rnd() * lerp(150, 400, spread);
      let bestCand = null, bestErr = 1e9;

      for (let tries = 0; tries < 70; tries++) {
        const phi = lerp(0.49, 0.40, spread) +
                    rnd() * lerp(0.59, 0.80, spread);
        const pts = flightPath(by, phi, 1600);
        if (!pts) continue;

        // how far behind the branch you will catch it — 50 deg, widening
        const entry = ENTRY + (rnd() - 0.5) * lerp(0.10, 0.58, spread);
        const ahead = ROPE * Math.sin(entry);
        const hang = ROPE * Math.cos(entry);

        /* where along the descent the branch sits. moving this changes the
           distance between branches, which is most of the visible variety */
        const vyPick = 50 + (rnd() - 0.5) * lerp(24, 150, spread);
        let ci = -1;
        for (let i = 0; i < pts.length; i++) {
          if (pts[i].vy > vyPick && pts[i].x > ROPE * 0.6) { ci = i; break; }
        }
        if (ci < 0) continue;
        const Xc = pts[ci].x, Yc = pts[ci].y;
        const relNext = Xc + ahead;
        if (relNext < 330 || relNext > 560) continue;   // keep it on screen
        const nby = Yc - hang;
        if (nby < 110 || nby > 620) continue;

        const w1 = relNext * (0.52 + (rnd() - 0.5) * lerp(0.05, 0.20, spread));
        const g1 = yAt(pts, w1);
        if (g1 === null || g1 < 210 || g1 > 820) continue;

        // confirm this very flight actually comes within reach of it
        let caught = false;
        for (const p of pts) {
          if (p.vy > -60 &&
              Math.hypot(relNext - p.x, nby - p.y) <= CATCH_R) {
            caught = true; break;
          }
        }
        if (!caught) continue;

        const err = Math.abs(nby - target);
        if (err < bestErr) {
          bestErr = err;
          bestCand = { relNext, nby, w1, g1, pts };
          if (err < 30) break;
        }
      }

      if (bestCand) {
        const { relNext, nby, w1, g1, pts } = bestCand;
        const walls = [{ x: bx + w1, gapY: g1, gap: c.gap, passed: false }];

        // sometimes a second wall on the same flight, so one release
        // still threads both — that is what makes it hard
        if (rnd() < c.dbl) {
          const w2 = w1 + lerp(140, 105, c.d);
          if (w2 < relNext - 70) {
            const g2 = yAt(pts, w2);
            if (g2 !== null && g2 >= 210 && g2 <= 860) {
              walls.push({ x: bx + w2, gapY: g2, gap: c.gap, passed: false });
            }
          }
        }

        // sometimes split the opening into an upper and a lower lane. the
        // ideal flight sits centred in one of them, so it stays passable
        if (walls.length === 1 && c.d > 0.32 && rnd() < 0.32) {
          const laneH = Math.min(120, Math.max(62, c.gap * 0.66));
          const blkH = 46;
          const idealUpper = rnd() < 0.5;
          let upperC, blkC, lowerC;
          if (idealUpper) {
            upperC = g1;
            blkC = g1 + laneH / 2 + blkH / 2;
            lowerC = blkC + blkH / 2 + laneH / 2;
          } else {
            lowerC = g1;
            blkC = g1 - laneH / 2 - blkH / 2;
            upperC = blkC - blkH / 2 - laneH / 2;
          }
          const top = upperC - laneH / 2, bot = lowerC + laneH / 2;
          if (top > 170 && bot < 880) {
            walls[0].gapY = (top + bot) / 2;
            walls[0].gap = bot - top;
            walls[0].blk = blkC;
            walls[0].blkH = blkH;
          }
        }

        return { walls, nbx: bx + relNext, nby };
      }

      return {
        walls: [{ x: bx + 250, gapY: by + 210, gap: c.gap, passed: false }],
        nbx: bx + 474,
        nby: Math.max(180, Math.min(520, by)),
      };
    };

    const makeState = () => ({
      px: 0, py: 0, vx: 0, vy: 0,
      branch: null, holdT: 0, ropeLen: ROPE, swingV: CATCH_SPEED,
      branches: [], walls: [],
      trail: [], particles: [], popups: [],
      dead: false, deadT: 0, deadWhy: "",
      score: 0, passed: 0,
      camX: 0, camY: 0, shake: 0, flash: 0, timeScale: 1,
      zoom: 0.8, ui: 1, safeTop: 0,
      releases: 0, t: 0,
      blink: 0, nextBlink: 2 + Math.random() * 3,
      spin: 0, tailPhase: 0, drawAng: 0, armT: 1,
    });

    S.current = Object.assign(makeState(), {
      best: 0, muted: false, W: 0, H: 0, dpr: 1, raf: 0, last: 0,
    });

    const extend = () => {
      const s = S.current;
      while (s.branches.length < 2 ||
             s.branches[s.branches.length - 1].x < s.px + 1800) {
        const last = s.branches[s.branches.length - 1];
        const seg = genFrom(last.x, last.y, s.passed);
        for (const w of seg.walls) s.walls.push(w);
        s.branches.push({ x: seg.nbx, y: seg.nby, gone: false });
      }
    };

    /* standardise the swing so every arc matches. the vine starts at
       whatever length you caught it at and reels in to ROPE over about a
       quarter second — so nothing teleports, but a loose release still
       gets caught */
    const attach = (b) => {
      const s = S.current;
      s.branch = b;
      const dx = s.px - b.x, dy = s.py - b.y;
      const d = Math.hypot(dx, dy) || 1;
      const nx = dx / d, ny = dy / d;
      s.ropeLen = Math.max(ROPE, Math.min(CATCH_R, d));

      // the vine going taut throws away the radial part of your velocity.
      // whatever is left is what you swing with
      const radial = s.vx * nx + s.vy * ny;
      let vx = s.vx, vy = s.vy;
      if (radial > 0) { vx -= nx * radial; vy -= ny * radial; }
      const vt = Math.hypot(vx, vy);

      // convert that into an equivalent bottom-of-swing speed, and keep it
      // in a band so a bad entry cannot make the next gap unreachable
      const h = s.ropeLen - dy;
      let vb = Math.sqrt(Math.max(1e4, vt * vt + 2 * G * h));
      vb = Math.max(CATCH_SPEED * 0.88, Math.min(CATCH_SPEED * 1.14, vb));
      s.swingV = vb;

      const v = Math.sqrt(Math.max(2500, vb * vb - 2 * G * h));
      let tx = -ny, ty = nx;
      if (tx < 0) { tx = -tx; ty = -ty; }   // always swing forward
      s.vx = tx * v; s.vy = ty * v;
      s.holdT = 0;
      blip(392, 0.16, "sine", 0.07);
      blip(156, 0.09, "triangle", 0.05);
    };

    const reset = () => {
      const { best, muted, W, H, dpr, raf } = S.current;
      S.current = Object.assign(makeState(), {
        best, muted, W, H, dpr, raf, last: performance.now(),
      });
      const s = S.current;
      s.branches.push({ x: 0, y: 330, gone: false });
      // start at the back of the swing so the first thing you do is swing
      const phi = -ENTRY;   // start at the back of the arc
      s.px = Math.sin(phi) * ROPE;
      s.py = 330 + Math.cos(phi) * ROPE;
      attach(s.branches[0]);
      extend();
      s.camX = s.px; s.camY = s.py;
    };

    const resize = () => {
      const s = S.current;
      // measure the canvas, not the wrapper. if those two ever disagree the
      // backing store and the painted box drift and the whole scene scales
      const rect = canvas.getBoundingClientRect();
      const w = Math.max(Math.round(rect.width) || window.innerWidth, 1);
      const h = Math.max(Math.round(rect.height) || window.innerHeight, 1);
      const dpr = Math.min(window.devicePixelRatio || 1, 2);
      if (w === s.W && h === s.H && dpr === s.dpr) return;
      s.W = w; s.H = h; s.dpr = dpr;
      canvas.style.width = w + "px";
      canvas.style.height = h + "px";
      canvas.style.width = w + "px";
      canvas.style.height = h + "px";
      canvas.style.width = w + "px";
      canvas.style.height = h + "px";
      canvas.width = Math.round(w * dpr);
      canvas.height = Math.round(h * dpr);
      const probe = document.getElementById("safe");
      s.safeTop = probe ? probe.offsetHeight : 0;
      // fit the world to the space: about 900 units tall, and never less
      // than 700 wide, so the next trunk is on screen before you commit
      s.zoom = Math.max(0.45, Math.min(1.15, Math.min(h / 1040, w / 620)));
      s.ui = Math.max(0.68, Math.min(1.25, h / 760));
    };

    const burst = (x, y, n, color) => {
      const s = S.current;
      for (let i = 0; i < n; i++) {
        const a = rnd() * Math.PI * 2, sp = 70 + rnd() * 250;
        s.particles.push({
          x, y, vx: Math.cos(a) * sp, vy: Math.sin(a) * sp, life: 1, color,
        });
      }
    };

    const die = (why) => {
      const s = S.current;
      if (s.dead) return;
      s.dead = true; s.deadT = 0; s.deadWhy = why;
      s.best = Math.max(s.best, s.score);
      s.shake = 5;
      burst(s.px, s.py, 30, COL.bad);
      blip(240, 0.35, "sawtooth", 0.08, 55);
    };

    const release = () => {
      const s = S.current;
      if (!s.branch) return;
      s.vx *= KICK; s.vy *= KICK;
      s.branch.gone = true;
      s.branch = null;
      s.releases += 1;
      s.timeScale = 0.7;
      blip(330, 0.09, "sine", 0.05, 470);
    };

    const tap = () => {
      const s = S.current;
      initAudio();
      if (s.dead) { if (s.deadT > 0.3) reset(); return; }
      release();
    };

    canvas.addEventListener("pointerdown", (e) => { e.preventDefault(); tap(); });
    const onKey = (e) => {
      if (e.code === "Space" || e.code === "ArrowUp") {
        e.preventDefault();
        if (!e.repeat) tap();
      }
      if (e.key === "m" || e.key === "M") S.current.muted = !S.current.muted;
      if (e.key === "r" || e.key === "R") reset();
    };
    window.addEventListener("keydown", onKey);

    /* ---------- step ---------- */
    const step = (dt) => {
      const s = S.current;
      s.t += dt;
      if (s.dead) {
        s.deadT += dt;
        s.shake = Math.max(0, s.shake - dt * 34);
        s.flash = Math.max(0, s.flash - dt * 2.4);
        s.spin += dt * 7;
        s.vy += G * 0.55 * dt;
        s.px += s.vx * 0.35 * dt;
        s.py += s.vy * dt;
        stepParticles(dt);
        return;
      }

      s.vy += G * dt;
      s.px += s.vx * dt;
      s.py += s.vy * dt;

      if (s.branch) {
        const b = s.branch;
        if (s.ropeLen > ROPE) s.ropeLen = Math.max(ROPE, s.ropeLen - REEL * dt);
        const dx = s.px - b.x, dy = s.py - b.y;
        const d = Math.hypot(dx, dy) || 1;
        if (d > s.ropeLen) {
          const nx = dx / d, ny = dy / d;
          s.px = b.x + nx * s.ropeLen;
          s.py = b.y + ny * s.ropeLen;
          const radial = s.vx * nx + s.vy * ny;
          if (radial > 0) { s.vx -= nx * radial; s.vy -= ny * radial; }
        }

        /* hold the swing to the energy it arrived with. conserving it means
           the vine can never pump you, but carrying it means a fast entry
           gives a fast wide swing and a slow one gives a lazy swing —
           that variation is the difference between physics and a loop */
        const h = s.ropeLen - (s.py - b.y);
        const want = Math.sqrt(Math.max(
          2500, s.swingV * s.swingV - 2 * G * h));
        const sp = Math.hypot(s.vx, s.vy) || 1;
        const f = want / sp;
        s.vx *= f; s.vy *= f;
        s.holdT += dt;
        if (s.holdT > cfgFor(s.passed).snap) {
          burst(b.x, b.y, 14, "#6E5A44");
          blip(150, 0.2, "sawtooth", 0.06, 44);
          b.gone = true;
          s.branch = null;
          s.shake = 5;
        }
      } else {
        // catch the next branch on the way down
        for (const b of s.branches) {
          if (b.gone) continue;
          if (b.x < s.px - 40) continue;
          if (s.vy <= -90) continue;
          if (Math.hypot(b.x - s.px, b.y - s.py) <= CATCH_R) { attach(b); break; }
        }
      }

      // walls
      for (const w of s.walls) {
        if (Math.abs(s.px - w.x) < WALL_W / 2 + PR) {
          const top = w.gapY - w.gap / 2, bot = w.gapY + w.gap / 2;
          if (s.py - PR < top || s.py + PR > bot) { die("CLIPPED"); return; }
          if (w.blk !== undefined) {
            const bt = w.blk - w.blkH / 2, bb = w.blk + w.blkH / 2;
            if (s.py + PR > bt && s.py - PR < bb) { die("CLIPPED"); return; }
          }
        }
        if (!w.passed && s.px > w.x + WALL_W / 2) {
          w.passed = true;
          s.passed += 1;
          s.score += 1;
          s.flash = 0.16;
          s.popups.push({ x: w.x, y: w.gapY, text: "+1", life: 1 });
          // leaves come off the foliage you brush past, not off the monkey
          const edges = [w.gapY - w.gap / 2, w.gapY + w.gap / 2];
          for (const ey of edges) {
            for (let i = 0; i < 5; i++) {
              const a = rnd() * Math.PI * 2, sp = 40 + rnd() * 130;
              s.particles.push({
                x: w.x + (rnd() - 0.5) * 24,
                y: ey + (rnd() - 0.5) * 14,
                vx: Math.cos(a) * sp * 0.5 + 40,
                vy: Math.sin(a) * sp - 20,
                life: 1, leaf: true,
                rot: rnd() * 6.3, spin: (rnd() - 0.5) * 8,
                color: rnd() < 0.5 ? COL.leaf : COL.leafHi,
              });
            }
          }
          blip(880, 0.13, "sine", 0.065);
          blip(1320, 0.09, "sine", 0.03);
        }
      }

      if (s.py > DEATH_Y) { die("FELL"); return; }

      s.trail.push({ x: s.px, y: s.py });
      if (s.trail.length > 46) s.trail.shift();

      extend();
      if (s.branches.length > 40) s.branches.splice(0, s.branches.length - 40);
      if (s.walls.length > 40) s.walls.splice(0, s.walls.length - 40);

      stepParticles(dt);
      for (let i = s.popups.length - 1; i >= 0; i--) {
        const p = s.popups[i];
        p.y -= 50 * dt; p.life -= dt * 1.1;
        if (p.life <= 0) s.popups.splice(i, 1);
      }
      s.flash = Math.max(0, s.flash - dt * 2.4);
      s.shake = Math.max(0, s.shake - dt * 22);
      s.tailPhase += dt * (3 + Math.hypot(s.vx, s.vy) / 260);

      // ease the pose. the taut vine removes radial velocity in one frame,
      // so the raw heading jumps — smoothing it is what stops the pop
      const wantAng = Math.atan2(s.vy, s.vx) * 0.28;
      let da = wantAng - s.drawAng;
      while (da > Math.PI) da -= Math.PI * 2;
      while (da < -Math.PI) da += Math.PI * 2;
      s.drawAng += da * Math.min(1, dt * 9);
      const wantArm = s.branch ? 1 : 0;
      s.armT += (wantArm - s.armT) * Math.min(1, dt * 11);
      s.blink -= dt;
      if (s.blink < -s.nextBlink) {
        s.blink = 0.13;
        s.nextBlink = 2 + rnd() * 3.5;
      }
      s.timeScale += (1 - s.timeScale) * Math.min(1, dt * 6);

      s.camX += (s.px - s.camX) * Math.min(1, dt * 4.6);
      s.camY += (s.py - s.camY) * Math.min(1, dt * 2.6);
    };

    const stepParticles = (dt) => {
      const s = S.current;
      for (let i = s.particles.length - 1; i >= 0; i--) {
        const p = s.particles[i];
        p.vy += G * 0.3 * dt;
        p.x += p.vx * dt; p.y += p.vy * dt;
        p.vx *= 1 - 1.2 * dt;
        if (p.leaf) { p.rot += p.spin * dt; p.vy *= 1 - 1.8 * dt; }
        p.life -= dt * 1.3;
        if (p.life <= 0) s.particles.splice(i, 1);
      }
    };

    /* ---------- character ----------
       drawn in the same units as the SVG mark (head radius 42) and scaled
       down, so the game character and the site character are the same
       drawing. flat fills, one dark outline, gentle frown. */
    const drawMonkey = (s, ang) => {
      const SC = PR / 24;
      const t = s.armT;                       // 1 holding the vine, 0 flying
      const mix = (a, b) => a + (b - a) * t;

      ctx.save();
      ctx.translate(s.px, s.py);
      ctx.rotate(ang + (12 * Math.PI / 180) * t);   // leans while swinging
      ctx.scale(SC, SC);
      ctx.lineJoin = "round";
      ctx.lineCap = "round";
      ctx.strokeStyle = COL.ink;

      const stroked = (fill, w, path) => {
        ctx.beginPath();
        path();
        ctx.lineWidth = w;
        ctx.stroke();
        if (fill) { ctx.fillStyle = fill; ctx.fill(); }
      };

      // tail
      ctx.lineWidth = 11;
      ctx.beginPath();
      ctx.moveTo(-26, 40);
      ctx.bezierCurveTo(-96, 40, -110, -6, -78, -30);
      ctx.stroke();

      // arms: gripping up when held, swept out when free
      ctx.lineWidth = 13;
      ctx.beginPath();
      ctx.moveTo(-22, 4);
      ctx.lineTo(mix(-52, -40), mix(-20, -34));
      ctx.lineTo(mix(-84, -30), mix(-2, -78));
      ctx.moveTo(22, 6);
      ctx.lineTo(mix(56, 52), mix(-8, -28));
      ctx.lineTo(mix(86, 74), mix(-18, -66));
      ctx.stroke();

      ctx.lineWidth = 7;
      // body
      stroked(COL.furDark, 7, () => ctx.ellipse(0, 26, 34, 44, 0, 0, 6.3));
      // ears
      stroked(COL.fur, 7, () => ctx.arc(-40, -38, 18, 0, 6.3));
      stroked(COL.fur, 7, () => ctx.arc(40, -38, 18, 0, 6.3));
      // head
      stroked(COL.fur, 7, () => ctx.arc(0, -30, 42, 0, 6.3));
      // face patch
      stroked(COL.belly, 7, () => ctx.ellipse(2, -18, 26, 21, 0, 0, 6.3));

      // eyes, looking where he is going
      const open = s.blink > 0 ? 0.14 : 1;
      stroked("#FFFFFF", 7,
        () => ctx.ellipse(-13, -40, 15, 17 * open, 0, 0, 6.3));
      stroked("#FFFFFF", 7,
        () => ctx.ellipse(17, -40, 15, 17 * open, 0, 0, 6.3));
      if (open > 0.5) {
        ctx.fillStyle = COL.ink;
        ctx.beginPath(); ctx.arc(-6, -39, 6, 0, 6.3); ctx.fill();
        ctx.beginPath(); ctx.arc(24, -39, 6, 0, 6.3); ctx.fill();
      }

      // gentle frown
      ctx.lineWidth = 5;
      ctx.beginPath();
      ctx.moveTo(-10, -8);
      ctx.quadraticCurveTo(2, -16, 14, -8);
      ctx.stroke();

      ctx.restore();
    };

    /* ---------- draw ---------- */
    const draw = () => {
      const s = S.current;
      const W = s.W, H = s.H;
      const Z = s.zoom;
      const vw = W / Z, vh = H / Z;

      ctx.setTransform(s.dpr, 0, 0, s.dpr, 0, 0);

      // sky
      const g = ctx.createLinearGradient(0, 0, 0, H);
      g.addColorStop(0, COL.sky0);
      g.addColorStop(0.5, COL.sky1);
      g.addColorStop(1, COL.sky2);
      ctx.fillStyle = g;
      ctx.fillRect(0, 0, W, H);

      const sx = s.shake ? (Math.random() - 0.5) * s.shake : 0;
      const sy = s.shake ? (Math.random() - 0.5) * s.shake : 0;
      const cx = s.camX + (0.5 - 0.26) * vw, cy = s.camY;

      /* backdrop drifts horizontally only. giving it vertical parallax made
         the whole world bob on every swing, which reads as jitter */

      // ---- clouds
      {
        const ox = cx * 0.02;
        ctx.fillStyle = COL.cloud;
        ctx.globalAlpha = 0.6;
        for (let i = -1; i < 8; i++) {
          const bx = i * 470 - (ox % 470) - 235 + hash(i * 3.3) * 120;
          const by = H * (0.08 + hash(i * 7.7) * 0.16);
          const sc = 0.8 + hash(i * 5.1) * 0.5;
          for (const [dx, dy, r] of [[-48, 6, 28], [0, 0, 40], [46, 8, 26]]) {
            ctx.beginPath();
            ctx.ellipse(bx + dx * sc, by + dy * sc, r * sc, r * sc * 0.56,
                        0, 0, 6.3);
            ctx.fill();
          }
        }
        ctx.globalAlpha = 1;
      }

      /* a canopy is a base shape with a few bumps on its upper edge —
         that lumpy silhouette is what stops it reading as an ellipse */
      const scallop = (x, y, rx, ry, bumps, fill) => {
        ctx.fillStyle = fill;
        ctx.beginPath();
        ctx.ellipse(x, y, rx, ry, 0, 0, 6.3);
        ctx.fill();
        for (let i = 0; i < bumps; i++) {
          const a = Math.PI + (i / (bumps - 1)) * Math.PI;
          ctx.beginPath();
          ctx.arc(x + Math.cos(a) * rx * 0.9, y + Math.sin(a) * ry * 0.9,
                  rx * 0.22, 0, 6.3);
          ctx.fill();
        }
      };

      // ---- one treeline
      {
        const ox = cx * 0.12;
        const spacing = 260;
        const i0 = Math.floor((ox - 300) / spacing);
        const i1 = Math.ceil((ox + W + 300) / spacing);
        for (let i = i0; i <= i1; i++) {
          const x = i * spacing + hash(i + 47) * spacing * 0.6 - ox;
          const sc = 0.9 + hash(i + 78) * 0.4;
          const y = H * 0.84 + hash(i + 57) * 22;
          ctx.fillStyle = COL.mintTrunk;
          ctx.fillRect(x - 6 * sc, y - 40 * sc, 12 * sc, 90 * sc);
          scallop(x, y - 60 * sc, 50 * sc, 38 * sc, 6, COL.mintCanopy);
          scallop(x - 32 * sc, y - 38 * sc, 28 * sc, 22 * sc, 5,
                  COL.mintCanopy2);
        }
      }

      // ---- ground, two bands
      {
        const gy = H * 0.90;
        // wavy top edge — a fillRect here leaves a hard line across the screen
        ctx.fillStyle = COL.ground2;
        ctx.beginPath();
        ctx.moveTo(-40, gy);
        for (let x = -40; x <= W + 40; x += 20) {
          ctx.lineTo(x, gy + Math.sin((x + cx * 0.18) / 240 + 2.1) * 14);
        }
        ctx.lineTo(W + 40, H + 120);
        ctx.lineTo(-40, H + 120);
        ctx.closePath();
        ctx.fill();
        ctx.fillStyle = COL.ground1;
        ctx.beginPath();
        ctx.moveTo(-40, gy + 40);
        for (let x = -40; x <= W + 40; x += 20) {
          ctx.lineTo(x, gy + 40 + Math.sin((x + cx * 0.18) / 200) * 12);
        }
        ctx.lineTo(W + 40, H + 120);
        ctx.lineTo(-40, H + 120);
        ctx.closePath();
        ctx.fill();
      }

      // haze wash so the play layer sits clearly in front
      ctx.fillStyle = "rgba(233,239,248,0.22)";
      ctx.fillRect(0, 0, W, H);

      ctx.save();
      ctx.translate(W / 2 + sx, H / 2 + sy);
      ctx.scale(Z, Z);
      ctx.translate(-cx, -cy);
      const L = cx - vw / 2, R = cx + vw / 2, T = cy - vh / 2, B = cy + vh / 2;

      // canopy shade, faded out so it has no visible edge
      const cz = ctx.createLinearGradient(0, WORLD_TOP + 220, 0, 320);
      cz.addColorStop(0, "rgba(76,109,115,0.22)");
      cz.addColorStop(1, "rgba(76,109,115,0)");
      ctx.fillStyle = cz;
      ctx.fillRect(L - 50, WORLD_TOP + 220, vw + 100, 320 - WORLD_TOP - 220);
      ctx.fillStyle = "rgba(76,109,115,0.22)";
      ctx.fillRect(L - 50, WORLD_TOP - 400, vw + 100, 620);
      // undergrowth: fades in at the top and then runs all the way to the
      // bottom of the world. stopping it short left a hard edge on screen
      const hz = ctx.createLinearGradient(0, DEATH_Y - 220, 0, DEATH_Y + 40);
      hz.addColorStop(0, "rgba(76,109,115,0)");
      hz.addColorStop(1, "rgba(76,109,115,0.92)");
      ctx.fillStyle = hz;
      ctx.fillRect(L - 50, DEATH_Y - 220, vw + 100, 260);
      ctx.fillStyle = "rgba(76,109,115,0.92)";
      ctx.fillRect(L - 50, DEATH_Y + 40, vw + 100, WORLD_BOT - DEATH_Y);

      // the trunks you actually play against
      const leafyColumn = (x, y0, y1) => {
        ctx.fillStyle = COL.trunk;
        ctx.fillRect(x - WALL_W / 2, y0, WALL_W, y1 - y0);
        ctx.fillStyle = COL.trunkDark;
        ctx.fillRect(x + WALL_W / 2 - 8, y0, 8, y1 - y0);
        ctx.strokeStyle = COL.trunkLine;
        ctx.lineWidth = 2.5;
        ctx.beginPath();
        ctx.moveTo(x - WALL_W / 2, y0); ctx.lineTo(x - WALL_W / 2, y1);
        ctx.moveTo(x + WALL_W / 2, y0); ctx.lineTo(x + WALL_W / 2, y1);
        ctx.stroke();
        // clumps on a fixed world grid so they never slide with the camera
        const first = Math.ceil((y0 + 24) / LEAF_STEP) * LEAF_STEP;
        for (let y = first; y < y1 - 14; y += LEAF_STEP) {
          const k = Math.floor(y / LEAF_STEP);
          const side = (k % 2) ? 1 : -1;
          const lx = x + side * (WALL_W / 2 + 13);
          ctx.beginPath();
          ctx.ellipse(lx, y, 21, 12, side * 0.32, 0, 6.3);
          ctx.fillStyle = side > 0 ? COL.leaf : COL.leafHi;
          ctx.fill();
          ctx.strokeStyle = COL.leafLine;
          ctx.lineWidth = 2;
          ctx.stroke();
          if (hash(k * 2.7 + x * 0.013) > 0.72) {
            ctx.beginPath();
            ctx.arc(lx + side * 8, y + 4, 3.8, 0, 6.3);
            ctx.fillStyle = COL.fruit;
            ctx.fill();
          }
        }
      };

      for (const w of s.walls) {
        if (w.x < L - 120 || w.x > R + 120) continue;
        const top = w.gapY - w.gap / 2, bot = w.gapY + w.gap / 2;
        leafyColumn(w.x, WORLD_TOP, top);
        leafyColumn(w.x, bot, WORLD_BOT);
        // rounded leafy lip at each gap edge
        ctx.lineWidth = 2.5;
        ctx.strokeStyle = COL.leafLine;
        ctx.fillStyle = COL.leafHi;
        ctx.beginPath(); ctx.ellipse(w.x, top, 26, 15, 0, 0, 6.3);
        ctx.fill(); ctx.stroke();
        ctx.beginPath(); ctx.ellipse(w.x, bot, 26, 15, 0, 0, 6.3);
        ctx.fill(); ctx.stroke();
        if (w.blk !== undefined) {
          ctx.fillStyle = COL.trunk;
          ctx.fillRect(w.x - WALL_W / 2, w.blk - w.blkH / 2, WALL_W, w.blkH);
          ctx.strokeStyle = COL.trunkLine;
          ctx.strokeRect(w.x - WALL_W / 2, w.blk - w.blkH / 2, WALL_W, w.blkH);
          ctx.strokeStyle = COL.leafLine;
          ctx.fillStyle = COL.leafHi;
          ctx.beginPath();
          ctx.ellipse(w.x, w.blk - w.blkH / 2, 22, 12, 0, 0, 6.3);
          ctx.fill(); ctx.stroke();
          ctx.beginPath();
          ctx.ellipse(w.x, w.blk + w.blkH / 2, 22, 12, 0, 0, 6.3);
          ctx.fill(); ctx.stroke();
        }
      }

      // branches with a leaf sprig
      for (const b of s.branches) {
        if (b.x < L - 100 || b.x > R + 100) continue;
        if (b.gone && b !== s.branch) continue;
        ctx.strokeStyle = COL.bark;
        ctx.lineWidth = 8;
        ctx.lineCap = "round";
        ctx.beginPath();
        ctx.moveTo(b.x - 29, b.y - 3);
        ctx.quadraticCurveTo(b.x, b.y - 10, b.x + 29, b.y - 2);
        ctx.stroke();
        for (const lx of [-21, 2, 23]) {
          ctx.beginPath();
          ctx.ellipse(b.x + lx, b.y - 15, 14, 8,
                      lx * 0.014 - 0.3, 0, 6.3);
          ctx.fillStyle = lx > 0 ? COL.leaf : COL.leafHi;
          ctx.fill();
        }
      }

      // aim stub
      if (s.branch && !s.dead) {
        let x = s.px, y = s.py, vx = s.vx * KICK, vy = s.vy * KICK;
        const h = 0.022;
        for (let i = 0; i < 16; i++) {
          vy += G * h; x += vx * h; y += vy * h;
          const f = 1 - i / 16;
          ctx.beginPath();
          ctx.arc(x, y, 3 * f, 0, 6.3);
          ctx.fillStyle = "rgba(242,168,59," + 0.7 * f + ")";
          ctx.fill();
        }
      }

      // motion trail
      ctx.lineCap = "round";
      for (let i = 1; i < s.trail.length; i++) {
        const t = i / s.trail.length;
        ctx.beginPath();
        ctx.moveTo(s.trail[i - 1].x, s.trail[i - 1].y);
        ctx.lineTo(s.trail[i].x, s.trail[i].y);
        ctx.strokeStyle = "rgba(255,255,255," + t * 0.2 + ")";
        ctx.lineWidth = t * 4;
        ctx.stroke();
      }

      // vine
      if (s.branch) {
        const frac = s.holdT / cfgFor(s.passed).snap;
        ctx.beginPath();
        ctx.moveTo(s.branch.x, s.branch.y);
        const mx = (s.branch.x + s.px) / 2, my = (s.branch.y + s.py) / 2;
        ctx.quadraticCurveTo(mx + 6, my + 10, s.px, s.py);
        ctx.strokeStyle = frac > 0.75 ? COL.bad : COL.rope;
        ctx.lineWidth = frac > 0.75 ? 3.2 : 2.6;
        ctx.stroke();
      }

      // particles: leaves tumble, everything else is a speck
      for (const p of s.particles) {
        ctx.globalAlpha = Math.max(0, Math.min(1, p.life));
        if (p.leaf) {
          ctx.save();
          ctx.translate(p.x, p.y);
          ctx.rotate(p.rot);
          ctx.beginPath();
          ctx.ellipse(0, 0, 7, 3.4, 0, 0, 6.3);
          ctx.fillStyle = p.color;
          ctx.fill();
          ctx.restore();
        } else {
          ctx.fillStyle = p.color;
          ctx.fillRect(p.x - 2, p.y - 2, 4, 4);
        }
      }
      ctx.globalAlpha = 1;

      // the monkey
      const ang = s.dead ? s.spin : s.drawAng;
      drawMonkey(s, ang);

      ctx.font = "700 17px 'Helvetica Neue', Inter, system-ui, sans-serif";
      ctx.textAlign = "center";
      for (const p of s.popups) {
        ctx.globalAlpha = Math.max(0, p.life);
        ctx.fillStyle = "#fff";
        ctx.strokeStyle = "rgba(44,32,22,0.5)";
        ctx.lineWidth = 3;
        ctx.strokeText(p.text, p.x, p.y);
        ctx.fillText(p.text, p.x, p.y);
      }
      ctx.globalAlpha = 1;
      ctx.restore();



      /* ---------- hud ---------- */
      const u = s.ui;
      const label = "700 " + (12 * u).toFixed(1) +
        "px 'Helvetica Neue', Inter, system-ui, sans-serif";
      const pop = 1 + Math.max(0, s.flash) * 0.7;
      ctx.save();
      ctx.translate(26 * u, 30 * u + s.safeTop);
      ctx.scale(pop * u, pop * u);
      const txt = String(s.score);
      ctx.font = "800 40px 'Helvetica Neue', Inter, system-ui, sans-serif";
      const tw2 = ctx.measureText(txt).width;
      const chipW = Math.max(64, tw2 + 34);
      ctx.fillStyle = "rgba(255,252,244,0.9)";
      ctx.beginPath();
      if (ctx.roundRect) ctx.roundRect(0, 0, chipW, 54, 27);
      else ctx.rect(0, 0, chipW, 54);
      ctx.fill();
      ctx.fillStyle = COL.ink;
      ctx.textAlign = "center";
      ctx.fillText(txt, chipW / 2, 40);
      ctx.restore();
      ctx.textAlign = "left";
      ctx.font = label;
      ctx.fillStyle = COL.dim;
      ctx.fillText("BEST " + s.best, 28 * u, 100 * u + s.safeTop);

      if (s.releases < 1 && !s.dead) {
        ctx.textAlign = "center";
        ctx.font = "700 " + (15 * u).toFixed(1) +
          "px 'Helvetica Neue', Inter, system-ui, sans-serif";
        ctx.fillStyle = "rgba(74,59,50,0.62)";
        ctx.fillText("tap to let go", W / 2, H - 76 * u);
        ctx.fillStyle = "rgba(74,59,50,0.4)";
        ctx.fillText("swing through the gaps", W / 2, H - 54 * u);
      }

      if (s.dead) {
        const a = Math.min(1, s.deadT * 3);
        ctx.fillStyle = "rgba(74,59,50," + a * 0.32 + ")";
        ctx.fillRect(0, 0, W, H);

        const cardW = Math.min(300 * u, W * 0.84), cardH = 200 * u;
        const cxx = (W - cardW) / 2, cyy = H / 2 - cardH / 2;
        ctx.globalAlpha = a;
        ctx.fillStyle = "#FFFCF4";
        ctx.beginPath();
        if (ctx.roundRect) ctx.roundRect(cxx, cyy, cardW, cardH, 26 * u);
        else ctx.rect(cxx, cyy, cardW, cardH);
        ctx.fill();

        const best = s.score >= s.best && s.score > 0;
        ctx.textAlign = "center";
        ctx.fillStyle = COL.ink;
        ctx.font = "800 " + (62 * u).toFixed(1) +
          "px 'Helvetica Neue', Inter, system-ui, sans-serif";
        ctx.fillText(String(s.score), W / 2, cyy + 78 * u);
        ctx.font = label;
        ctx.fillStyle = "rgba(74,59,50,0.55)";
        ctx.fillText(s.deadWhy === "FELL" ? "you fell" : "you clipped a trunk",
                     W / 2, cyy + 104 * u);

        if (best) {
          ctx.fillStyle = COL.accent;
          ctx.font = "800 " + (14 * u).toFixed(1) +
            "px 'Helvetica Neue', Inter, system-ui, sans-serif";
          ctx.fillText("NEW BEST", W / 2, cyy + 132 * u);
        } else {
          ctx.fillStyle = "rgba(74,59,50,0.45)";
          ctx.fillText("best " + s.best, W / 2, cyy + 132 * u);
        }

        if (s.deadT > 0.3) {
          ctx.fillStyle = COL.accent;
          ctx.beginPath();
          if (ctx.roundRect)
            ctx.roundRect(W / 2 - 78 * u, cyy + 152 * u, 156 * u, 38 * u, 19 * u);
          else ctx.rect(W / 2 - 78 * u, cyy + 152 * u, 156 * u, 38 * u);
          ctx.fill();
          ctx.fillStyle = "#4A3B32";
          ctx.font = "800 " + (13 * u).toFixed(1) +
            "px 'Helvetica Neue', Inter, system-ui, sans-serif";
          ctx.fillText("SWING AGAIN", W / 2, cyy + 176 * u);
        }
        ctx.globalAlpha = 1;
      }
    };

    resize();
    reset();
    S.current.last = performance.now();

    const loop = (now) => {
      const s = S.current;
      s.raf = requestAnimationFrame(loop);
      resize();
      let dt = (now - s.last) / 1000;
      s.last = now;
      if (dt > 0.05) dt = 0.05;
      const scaled = dt * s.timeScale;
      const steps = Math.max(1, Math.ceil(scaled / 0.003));
      for (let i = 0; i < steps; i++) step(scaled / steps);
      draw();
    };
    S.current.raf = requestAnimationFrame(loop);



if ("serviceWorker" in navigator) {
  window.addEventListener("load", function () {
    navigator.serviceWorker.register("sw.js").catch(function () {});
  });
}
})();
</script>
</body>
</html>
